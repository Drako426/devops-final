name: estudiante35

services:
  db:
    image: postgres:16-alpine
    container_name: est35_db
    env_file:
      - .env
    volumes:
      - pgdata_est35:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: est35-api:latest
    container_name: est35_api
    env_file:
      - .env
    ports:
      - "${API_PORT}:5000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata_est35:
    name: est35_pgdata
